services:
  proctor-sut:
    build: .
    image: proctor/sut:latest
    container_name: proctor-sut
    ports:
      - "127.0.0.1:8000:8000" # host access localhost-only
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
