[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proctor"
version = "0.1.0"
description = "Proctor - AI QA Testing Framework: nine-layer pyramid, statistical gates, offline-first (blueprint v2)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-jsonschema",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Heavy integrations are optional; the framework runs offline without them and
# activates them automatically when present (see docs/architecture.md).
ragas = ["ragas", "datasets"]
deepeval = ["deepeval"]
faiss = ["faiss-cpu"]
presidio = ["presidio-analyzer", "presidio-anonymizer"]
gemini = ["google-genai"]
anthropic = ["anthropic"]
openai = ["openai"]
playwright = ["playwright"]

[tool.setuptools.packages.find]
include = ["framework*", "clients*", "sut*", "evals*", "synthetic*", "guardrails*", "breakers*", "telemetry*", "evidence*", "domains*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "l1: pyramid rank 1 - baseline unit",
    "l2: pyramid rank 2 - prompt testing",
    "l3: pyramid rank 3 - API integration",
    "l4: pyramid rank 4 - retrieval",
    "l5: pyramid rank 5 - LLM output",
    "l6: pyramid rank 6 - RAG quality",
    "l7: pyramid rank 7 - agentic",
    "l8: pyramid rank 8 - AI security",
    "l9: pyramid rank 9 - end-to-end",
    "smoke: fast PR subset",
    "nightly: full regression",
]

[tool.coverage.run]
branch = true
source = ["framework", "clients", "sut", "evals", "synthetic", "breakers", "guardrails", "telemetry", "evidence", "domains"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
