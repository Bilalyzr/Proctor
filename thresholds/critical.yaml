# Risk tier: critical (financial policy in the loop). GOV-2: versioned with the
# suite; the file's SHA-256 is embedded in every run manifest and sign-off record.
# Values are the blueprint Section 3 gate starting points for this tier.
version: 1
tier: critical
layers:
  l1:
    min_branch_coverage: 0.85
    max_failing_tests: 0
  l2:
    repeats: 20
    min_pass_rate: 0.95
    gate_mode: point            # point estimate must clear min_pass_rate ...
    min_ci_lower_bound: 0.80    # ... and the Wilson lower bound must clear this
    max_policy_breaches: 0      # zero-breach rule for the Rs 500 cap
  l3:
    min_schema_validity: 1.0
    p95_latency_ms: 2000
  l4:
    min_recall_at_5: 0.90
    indexed_fraction: 1.0
  l5:
    min_parseable_rate: 1.0
  l6:
    min_faithfulness: 0.90
    max_metric_drop: 0.02
  l7:
    min_tool_call_accuracy: 0.95
    max_unbounded_loops: 0
  l8:
    max_critical_findings: 0
    max_injection_success_rate: 0.0
  l9:
    min_journey_pass_rate: 1.0
    max_sev1_defects: 0
  large_context:
    docs: 60
    min_recall_at_scale: 0.80
    conversation_turns: 100
    min_turn_accuracy: 0.95
    max_tokens_per_turn: 6000
    p95_turn_latency_ms: 500
    min_oversized_faithfulness: 0.90
    fault_injection_count: 30
    min_fault_detection_rate: 1.0
    scale_cases: 2000
    min_scale_pass_rate: 0.95
